project: PhotoChoice
title: Проверка резкости из основного списка фотографий
language: ru
version: "1.0"
goal: Фотограф одним действием проверяет причину предупреждения и сам решает судьбу кадра.

context:
  workflow: Ручной отбор репортажей по 100–2500 кадров перед обработкой в Capture One.
  existing_features:
    - Пометки на миниатюрах, раздел «Брак» и переход к проблемной области при увеличении 100% в этом разделе.
    - Определение точки проверки около глаз самого крупного лица или в области основного объекта.
    - Фильтр «Без звёзд» для повторного прохода и раздел «Серии» для выбора дублей.
  related_files:
    - PhotoChoice/PhotoAnalysis.swift
    - PhotoChoice/DefectRules.swift
    - PhotoChoice/GridView.swift
    - PhotoChoice/ViewerView.swift
  first_release_focus: Локализация нерезкости, понятная причина и переход к месту срабатывания из раздела «Все фото».
  deferred: Улучшения фильтра «Без звёзд» и раздела «Серии» оцениваются отдельно после наблюдения за реальным отбором.

requirements:
  business:
    - id: БТ-01
      statement: Сократить время ручной проверки технического брака при отборе съёмок объёмом от 100 до 2500 фотографий.
      verification: Сравнить медианное время от появления помеченного кадра до решения фотографа в текущей и новой версиях на одной размеченной съёмке.
    - id: БТ-02
      statement: Помочь фотографу замечать нерезкость участников группового фото и быстро проверять предупреждения, вызванные случайными людьми на фоне.
      verification: По разметке фотографа отдельно посчитать пропущенные случаи нерезкости участников и лишние предупреждения о людях на заднем плане.
    - id: БТ-03
      statement: Сохранить единый ручной процесс для репортажа, портрета, стрита и пейзажа. Художественную ценность определяет фотограф.
      verification: На групповом портрете, репортаже, стрит-кадре с движением и пейзаже с длинной выдержкой фотограф может принять своё решение и продолжить просмотр.

  functional:
    - id: ФТ-01
      statement: При включённом умном отборе показывать предупреждение о резкости в сетке «Все фото» и в просмотрщике отдельного кадра.
      verification: Причина доступна в обоих представлениях без перехода в раздел «Брак».
    - id: ФТ-02
      statement: Оценивать резкость каждого обнаруженного лица, для которого достаточно деталей. Привязывать локальное предупреждение к координатам этого лица.
      verification: На групповом снимке система может указать нерезкое лицо при резком крупнейшем лице. При недостатке деталей результат оценки лица считается неопределённым.
    - id: ФТ-03
      statement: Текст предупреждения должен отражать область, по которой обнаружены признаки нерезкости.
      verification: Для локального случая доступна соответствующая область и пояснение «Возможна нерезкость лица». Для признаков по всему кадру допустимо пояснение «Возможна общая нерезкость».
    - id: ФТ-04
      statement: По нажатию на пометку открывать связанную область при увеличении 100% как из сетки, так и из просмотрщика.
      verification: Одно нажатие показывает источник предупреждения. При нескольких помеченных лицах фотограф может последовательно проверить каждое.
    - id: ФТ-05
      statement: Возвращать целый кадр одним действием и продолжать просмотр с прежней позиции. Все решения об оценке и удалении принимает фотограф.
      verification: Открытие и закрытие предупреждения сохраняют звёзды, флаги, файлы и порядок просмотра. Отправка в корзину выполняется по явной команде, в том числе по клавише Del.
    - id: ФТ-06
      statement: Раздельно определять локальное предупреждение о лице и основание для включения всего кадра в раздел «Брак».
      verification: Одно нерезкое лицо случайного прохожего допускает локальную пометку. Для признания всего снимка кандидатом в брак нужны дополнительные признаки.

  nonfunctional:
    - id: НФТ-01
      statement: Выполнять анализ в фоне и обеспечивать просмотр, перелистывание и выставление звёзд до окончания обработки папки.
      verification: Начать отбор во время анализа 2500 кадров на MacBook Air M4. Сравнить задержку перелистывания и длительность полного анализа с текущей версией на тех же файлах.
    - id: НФТ-02
      statement: Обрабатывать лица, координаты областей и результаты проверки локально на Mac.
      verification: Выполнить весь сценарий при отключённой сети.
    - id: НФТ-03
      statement: Сопоставлять координаты лица в миниатюре и увеличенном изображении с учётом ориентации EXIF. Для RAW учитывать фактическое разрешение доступного превью.
      verification: Проверить горизонтальный JPEG, вертикальный снимок с поворотом по EXIF и RAW со встроенным превью. При недостаточной детализации сообщать об ограничении проверки.
    - id: НФТ-04
      statement: Поддерживать открытие существующих сессий и оценок после обновления. Недостающие данные о координатах в старом кэше пересчитывать в фоне.
      verification: Открыть ранее обработанную папку и проверить сохранность звёзд и появление новых пометок после пересчёта.
    - id: НФТ-05
      statement: Измерять качество определения нерезкости отдельно по типам сцен на фиксированной размеченной выборке.
      verification: Сравнить версии по обнаруженным случаям явной нерезкости, лишним предупреждениям и доле локальных предупреждений, открывающих нужное лицо.

acceptance_scenario:
  title: Нерезкий участник группового кадра
  given: На фото пять человек. Самое крупное лицо резкое, а лицо другого участника заметно смазано.
  when: Фотограф нажимает пометку на миниатюре в разделе «Все фото».
  then:
    - Снимок открывается при увеличении 100% на лице смазанного участника.
    - Фотограф может поставить звёзды или нажать Del и продолжить отбор.
  verifies: [ФТ-01, ФТ-02, ФТ-03, ФТ-04, ФТ-05]

open_questions:
  - related_to: [БТ-02, ФТ-06]
    decision: Согласовать по размеченным примерам признаки, по которым локальная нерезкость влияет на оценку всего кадра. Одного положения лица у края недостаточно.
  - related_to: [БТ-01, НФТ-01, НФТ-05]
    decision: Установить численные пороги приёмки после замера текущей версии.
